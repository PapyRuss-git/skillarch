"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os$username\
[◤](bg:color_yellow fg:color_orange)\
$directory\
[◤](fg:color_yellow bg:color_aqua)$git_branch$git_status\
[◤](fg:color_aqua bg:color_blue)$c$rust$golang$nodejs$php$python\
[◤](fg:color_blue)$docker_context$terraform\
$fill\
([](bg:color_bg1 fg:color_yellow)$cmd_duration)[◣](fg:color_yellow)\
([◥](fg:color_red)$status)\
$line_break$character"""

palette = 'everforest'

[palettes.everforest]
color_fg = '#d3c6aa'
color_bg1 = '#343f44'
color_bg3 = '#475258'
color_blue = '#7fbbb3'
color_aqua = '#83c092'
color_green = '#a7c080'
color_orange = '#e69875'
color_purple = '#d699b6'
color_red = '#e67e80'
color_yellow = '#dbbc7f'

[os]
disabled = false
style = "bg:color_orange fg:color_bg1"
format = '[ $symbol]($style)'

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Arch = "󰣇 "
Artix = "󰣇 "
CachyOS = "󰣇 "
EndeavourOS = "󰣇 "
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:color_orange fg:color_bg1"
style_root = "bg:color_orange fg:color_red"
format = '[$user]($style)'

[directory]
style = "fg:color_bg1 bg:color_yellow"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = " 󰋜 "
read_only = " 󰌾"
read_only_style = "fg:color_fg bg:color_red"

[directory.substitutions]
"Documents" = " 󰈙 "
"Downloads" = "  "
"Music" = " 󰝚 "
"Pictures" = "  "
"skillarch" = " 󰣇 "

[git_branch]
symbol = " "
style = "bg:color_aqua"
format = '[[ $symbol$branch ](fg:color_bg1 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_bg1 bg:color_aqua)]($style)'
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
conflicted = "="
deleted = "✘"
renamed = "󰁕"
modified = "!"
staged = "+"
untracked = "?"
stashed = "󰜦"

[nodejs]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[rust]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[golang]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[php]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[python]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_bg1 bg:color_blue)]($style)'

[docker_context]
symbol = " "
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:color_bg1 bg:color_bg3)]($style)'

[terraform]
symbol = "󱁢 "
style = "bg:color_bg3"
format = '[[ $symbol( $workspace) ](fg:color_bg1 bg:color_bg3)]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg bg:color_bg1)]($style)'

[fill]
symbol = "·"
style = "fg:color_bg3"

[cmd_duration]
min_time = 500
style = "fg:color_bg1 bg:color_yellow"
format = "[ 󱦟 $duration ]($style)"

[status]
disabled = false
style = "fg:color_fg bg:color_red"
format = "[[ $symbol$status ](fg:color_fg bg:color_red)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[✖](bold fg:color_red)'
