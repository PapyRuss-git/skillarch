# Fonts - Use non-Mono version for better powerline glyph rendering
font_family MesloLGS Nerd Font
bold_font MesloLGS Nerd Font Bold
italic_font MesloLGS Nerd Font Italic
bold_italic_font MesloLGS Nerd Font Bold Italic
font_size 16

# EverForest Theme Colors
foreground              #D3C6AA
background              #272E33
selection_foreground    #272E33
selection_background    #A7C080

# Cursor colors
cursor                  #A7C080
cursor_text_color       #272E33

# URL underline color when hovering with mouse
url_color               #83C092

# Kitty window border colors
active_border_color     #A7C080
inactive_border_color   #5C6A72
bell_border_color       #DBBC7F

# OS Window titlebar colors
wayland_titlebar_color  #1E2326
macos_titlebar_color    #1E2326

# Tab bar colors
active_tab_foreground   #D3C6AA
active_tab_background   #A7C080
inactive_tab_foreground #5C6A72
inactive_tab_background #272E33
tab_bar_background      #1E2326

# Colors for marks (marked text in the terminal)
mark1_foreground #272E33
mark1_background #7FBBB3
mark2_foreground #272E33
mark2_background #D699B6
mark3_foreground #272E33
mark3_background #83C092

# EverForest 16 terminal colors

# black/dark gray
color0 #323C41
color8 #5C6A72

# red
color1 #E67E80
color9 #E67E80

# green  
color2  #A7C080
color10 #A7C080

# yellow
color3  #DBBC7F
color11 #DBBC7F

# blue
color4  #7FBBB3
color12 #7FBBB3

# magenta
color5  #D699B6
color13 #D699B6

# cyan
color6  #83C092
color14 #83C092

# white/light gray
color7  #D3C6AA
color15 #D3C6AA

cursor_trail 3
cursor_trail_decay 0.1 0.4

# Blur is managed by compositor (picom for i3, Hyprland native)
background_opacity 1.0
enable_audio_bell no
