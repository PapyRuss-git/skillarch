# Hyprpaper Configuration for SkillArch
# Multi-monitor wallpaper setup with Everforest theme

# Preload wallpapers (faster switching)
preload = /opt/skillarch/assets/ARMOR_wallpaper.png

# Set wallpaper per monitor
# Laptop screen (eDP-1)
wallpaper = eDP-1,/opt/skillarch/assets/ARMOR_wallpaper.png

# Main monitor (DVI-I-1)
wallpaper = DVI-I-1,/opt/skillarch/assets/ARMOR_wallpaper.png

# Vertical monitor (DVI-I-2)
wallpaper = DVI-I-2,/opt/skillarch/assets/ARMOR_wallpaper.png

# Fallback for any other monitor
wallpaper = ,/opt/skillarch/assets/ARMOR_wallpaper.png

# Disable splash text
splash = false

# Enable IPC for runtime control (hyprctl hyprpaper commands)
ipc = on
