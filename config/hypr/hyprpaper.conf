# Hyprpaper Configuration for SkillArch
# Keep hyprpaper as the renderer. Rotation is handled by
# config/hypr/scripts/wallpaper-rotate.sh so every monitor receives the same
# chosen image at the same time.

wallpaper {
    monitor =
    path = /opt/skillarch/assets/wallpaper-slideshow/00-everforest-bg.jpg
    fit_mode = cover
}

# Disable splash text
splash = false

# Enable IPC for runtime control (hyprctl hyprpaper commands)
ipc = on
