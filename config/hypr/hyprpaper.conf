# Hyprpaper Configuration for SkillArch
# Multi-monitor wallpaper setup with Everforest theme
# Syntax updated for hyprpaper 0.8+

# Preload wallpapers (faster switching)
preload = /opt/skillarch/assets/ARMOR_wallpaper.png

# Laptop screen (eDP-1)
wallpaper {
    monitor = eDP-1
    path = /opt/skillarch/assets/ARMOR_wallpaper.png
}

# Main monitor (DVI-I-1)
wallpaper {
    monitor = DVI-I-1
    path = /opt/skillarch/assets/ARMOR_wallpaper.png
}

# Vertical monitor (DVI-I-2)
wallpaper {
    monitor = DVI-I-2
    path = /opt/skillarch/assets/ARMOR_wallpaper.png
}

# Fallback for any other monitor
wallpaper {
    monitor =
    path = /opt/skillarch/assets/ARMOR_wallpaper.png
}

# Disable splash text
splash = false

# Enable IPC for runtime control (hyprctl hyprpaper commands)
ipc = on
