# Hyprland Configuration for SkillArch - VM OPTIMIZED
# Optimized for VirtualBox, VMware, and other virtual machines
# No animations, no blur, no shadows - maximum performance

# Environment variables for GNOME compatibility
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt/Wayland variables
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# GTK variables for Wayland
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland

# VM-specific environment variables (CRITICAL for VMs)
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Cursor theme (hyprcursor)
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

# Qt Quick Controls theming (pour hyprpolkitagent)
env = QT_QUICK_CONTROLS_STYLE,Fusion
env = QT_QUICK_CONTROLS_MATERIAL_THEME,Dark

# Monitor configuration - Single monitor (VM default)
monitor = ,preferred,auto,1

# Input configuration
input {
    kb_layout = fr
    kb_variant = azerty
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    natural_scroll = false
    touchpad {
        natural_scroll = false
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }

    sensitivity = 0
}

# General settings - VM optimized
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(a7c080ff) rgba(83c092ff) 45deg
    col.inactive_border = rgba(5c6a72aa)

    layout = dwindle
    allow_tearing = false
}

# Decoration - VM optimized (NO BLUR, NO SHADOWS)
decoration {
    rounding = 0  # No rounding to save GPU cycles

    blur {
        enabled = false  # DISABLED for VM performance
    }

    shadow {
        enabled = false  # DISABLED for VM performance
    }

    # Active/inactive window dimming
    dim_inactive = false
    dim_strength = 0.0
}

# Animations - DISABLED for VM performance
animations {
    enabled = false
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# Gestures - DISABLED for VM (no touchpad usually)
gestures {
    # Disabled for VM
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true  # Variable frame rate for better VM performance
    vrr = 0  # VRR disabled (not supported in VMs)
}

# Window rules for GNOME apps (v0.53+ syntax)
windowrule = float on, match:class gnome-control-center
windowrule = float on, match:class org\.gnome\.Nautilus, match:title .*Properties
windowrule = float on, match:class pavucontrol
windowrule = float on, match:title Help: SkillArch.*

# Clipboard manager
windowrule = float on, match:class floating
windowrule = center on, match:class floating
windowrule = size 800 600, match:class floating

# Security tools - Pen testing apps
windowrule = float on, match:class burpsuite-.*
windowrule = float on, match:title Wireshark
windowrule = float on, match:title Metasploit

# Browser picture-in-picture
windowrule = float on, match:title Picture-in-Picture
windowrule = pin on, match:title Picture-in-Picture
windowrule = size 640 360, match:title Picture-in-Picture
windowrule = move 100%-w-20 100%-w-20, match:title Picture-in-Picture

# Firefox sharing indicator
windowrule = workspace special:silent, match:title Firefox — Sharing Indicator
windowrule = workspace special:silent, match:title .*is sharing (your screen|a window)\.

# Dialog windows
windowrule = float on, match:class xdg-desktop-portal-gtk
windowrule = size 800 600, match:class xdg-desktop-portal-gtk
windowrule = center on, match:class xdg-desktop-portal-gtk

# Terminal dropdown (scratchpad alternative)
windowrule = float on, match:class kitty-dropdown
windowrule = size 80% 60%, match:class kitty-dropdown
windowrule = move 10% 5%, match:class kitty-dropdown

# Opacity rules - DISABLED for VM performance (full opacity everywhere)
windowrule = opacity 1.0 override, match:class kitty
windowrule = opacity 1.0 override, match:class code-url-handler
windowrule = opacity 1.0 override, match:class zen-alpha

# Autostart
exec-once = ~/.config/hypr/scripts/start-bar.sh
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = dunst
exec-once = hyprsunset
exec-once = clipse -listen
exec-once = /usr/lib/gsd-rfkill

# Key bindings - AZERTY layout adapted from i3
$mainMod = SUPER

# Terminal and apps
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, zen-browser
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod SHIFT, Space, exec, rofi -show run
bind = $mainMod CTRL, Space, exec, rofi -show window

# Window management
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d

bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d

bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, togglefloating,

# Workspaces - AZERTY bindings
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parenleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, egrave, workspace, 7
bind = $mainMod, underscore, workspace, 8
bind = $mainMod, ccedilla, workspace, 9
bind = $mainMod, agrave, workspace, 10

# Move to workspaces - AZERTY
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parenleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, egrave, movetoworkspace, 7
bind = $mainMod SHIFT, underscore, movetoworkspace, 8
bind = $mainMod SHIFT, ccedilla, movetoworkspace, 9
bind = $mainMod SHIFT, agrave, movetoworkspace, 10

# Screenshots
bind = $mainMod, P, exec, grim -g "$(slurp)" ~/Images/screenshot_$(date +%Y%m%d_%H%M%S).png
bind = $mainMod SHIFT, P, exec, grim -g "$(slurp)" - | wl-copy

# Audio controls
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = $mainMod, M, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# Brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Night light (hyprsunset) - Toggle blue light filter
bind = $mainMod, F9, exec, pkill -x hyprsunset || hyprsunset >/dev/null 2>&1

# Resize mode (like i3)
bind = $mainMod, R, submap, resize
submap = resize
binde = , Left, resizeactive, -20 0
binde = , Right, resizeactive, 20 0
binde = , Up, resizeactive, 0 -20
binde = , Down, resizeactive, 0 20
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# App shortcuts
bind = $mainMod, S, exec, pavucontrol
bind = $mainMod SHIFT, S, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center
bind = $mainMod, E, exec, emote
bind = $mainMod, B, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center bluetooth
bind = $mainMod, W, exec, XDG_CURRENT_DESKTOP=GNOME gnome-control-center wifi
bind = $mainMod, N, exec, nautilus
bind = $mainMod, V, exec, kitty --class=floating -e clipse
bind = $mainMod, C, exec, code
bind = $mainMod, K, exec, cursor

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Power menu
bind = $mainMod, Escape, exec, wlogout

# Hyprland controls
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl dispatch exit

# Help bindings (adapted from i3)
bind = $mainMod, H, exec, kitty --title "Help: SkillArch Bindings" zsh -ic "ska-help-bindings"
bind = $mainMod SHIFT, H, exec, kitty --title "Help: SkillArch Aliases" zsh -ic "ska-help-aliases"
bind = $mainMod CTRL, H, exec, kitty --title "Help: SkillArch packages" zsh -ic "ska-help-packages"

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Scratchpad equivalent (special workspace)
bind = $mainMod SHIFT, A, movetoworkspace, special:scratchpad
bind = $mainMod, A, togglespecialworkspace, scratchpad
