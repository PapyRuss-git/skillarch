# Hyprland VM Mode - Performance optimized overrides
# Sourced at the end of hyprland.conf to override desktop defaults

# VM-specific environment (hardware cursor workaround)
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Disable Caps Lock → Escape swap in VM
input {
    kb_options =
}

# Tighter gaps, no tearing
general {
    gaps_in = 3
    gaps_out = 3
    allow_tearing = false
}

# No visual effects
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
    dim_inactive = false
}

# No animations
animations {
    enabled = false
}

# VM display settings
misc {
    vrr = 0
}

# Full opacity everywhere
windowrule = opacity 1.0 override, match:class kitty
windowrule = opacity 1.0 override, match:class code-url-handler
