# Hyprlock Configuration for SkillArch
# Everforest Hard Dark Theme

general {
    hide_cursor = true
    grace = 3
    no_fade_in = false
    no_fade_out = false
}

# Background avec blur Everforest
background {
    monitor =
    path = /opt/skillarch/assets/everforest-bg.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
    contrast = 0.9
}

# Horloge - Everforest Green
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(D3C6AAFF)  # Everforest foreground
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

# Date - Everforest dimmed
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(9DA9A0FF)  # Everforest secondary
    font_size = 24
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

# Username - Everforest Aqua
label {
    monitor =
    text = $USER
    color = rgba(83C092FF)  # Everforest Aqua
    font_size = 20
    font_family = JetBrains Mono Bold
    position = 0, 20
    halign = center
    valign = center
}

# Batterie - Everforest Yellow
label {
    monitor =
    text = cmd[update:5000] bash -c 'if [ -f /sys/class/power_supply/BAT0/capacity ]; then echo "$(cat /sys/class/power_supply/BAT0/capacity)%"; else echo ""; fi'
    color = rgba(DBBC7FFF)  # Everforest Yellow
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = center
}

# Input field - Everforest style
input-field {
    monitor =
    size = 400, 60
    position = 0, -80
    dots_center = true
    dots_size = 0.2
    dots_spacing = 0.3
    fade_on_empty = true
    fade_timeout = 1000

    # Everforest colors
    font_color = rgba(D3C6AAFF)          # Everforest foreground
    inner_color = rgba(2E383CFF)         # Everforest surface
    outer_color = rgba(A7C080FF)         # Everforest green
    check_color = rgba(83C092FF)         # Everforest aqua
    fail_color = rgba(E67E80FF)          # Everforest red

    outline_thickness = 3
    placeholder_text = <span foreground="##9DA9A0"><i>Entrez votre mot de passe...</i></span>
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(1E2326AA)

    capslock_color = rgba(E69875FF)      # Everforest orange
    numlock_color = rgba(7FBBB3FF)       # Everforest blue
    bothlock_color = rgba(D699B6FF)      # Everforest purple
}

