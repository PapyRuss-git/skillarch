# Hypridle Configuration for SkillArch
# Gestion de l'inactivité et économie d'énergie

general {
    # Ignorer l'audio en cours de lecture pour déclencher l'inactivité
    ignore_dbus_inhibit = false

    # Ignorer systemd-inhibit
    ignore_systemd_inhibit = false
}

# Listener 1: Diminuer la luminosité après 5 minutes
listener {
    timeout = 300  # 5 minutes
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Listener 2: Verrouiller l'écran après 10 minutes
listener {
    timeout = 600  # 10 minutes
    on-timeout = loginctl lock-session
}

# Listener 3: Éteindre les écrans après 15 minutes
listener {
    timeout = 900  # 15 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Listener 4: Suspendre le système après 30 minutes (désactivé par défaut)
# Décommenter si vous souhaitez la suspension automatique
# listener {
#     timeout = 1800  # 30 minutes
#     on-timeout = systemctl suspend
# }
