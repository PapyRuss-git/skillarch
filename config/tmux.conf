# SkillArch tmux configuration - Everforest Hard Dark theme

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,kitty:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g focus-events on

# --- Prefix ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split with current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Help: fuzzy search bindings with C-a ?
bind ? display-popup -w 80% -h 70% -E "tmux list-keys | sed 's/bind-key *-T */-T /;s/ *-T prefix/prefix/' | fzf --header='Tmux Bindings (prefix = C-a)' --reverse --no-sort"

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# --- Everforest Hard Dark Theme ---

# Pane borders
set -g pane-border-style "fg=#414B50"
set -g pane-active-border-style "fg=#A7C080"

# Message style
set -g message-style "fg=#D3C6AA,bg=#2E383C"
set -g message-command-style "fg=#D3C6AA,bg=#2E383C"

# Copy mode highlight
setw -g mode-style "fg=#272E33,bg=#A7C080"

# Clock
setw -g clock-mode-colour "#A7C080"

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#9DA9A0,bg=#1E2326"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#272E33,bg=#A7C080,bold]  #S #[fg=#A7C080,bg=#1E2326,nobold] "

# Right: host and time
set -g status-right-length 50
set -g status-right "#[fg=#7A8478]#H  #[fg=#9DA9A0]%H:%M #[fg=#272E33,bg=#7FBBB3,bold] %d/%m "

# Window tabs
set -g window-status-format "#[fg=#7A8478,bg=#1E2326]  #I:#W "
set -g window-status-current-format "#[fg=#D3C6AA,bg=#2E383C,bold]  #I:#W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#DBBC7F"
set -g window-status-bell-style "fg=#E67E80"
